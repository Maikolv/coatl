# Configuración de HawkScan (StackHawk) para COATL.
# La clave NUNCA va aquí: se pasa como variable de entorno HAWK_API_KEY / API_KEY.
# Uso: APP_HOST=http://127.0.0.1:8000 hawk scan
app:
  applicationId: ${APP_ID:c097a7f6-d022-4b52-a50c-68efd438abfd}
  env: ${APP_ENV:Production}
  # Sitio estático (dist/ servido por scripts/servir.mjs o GitHub Pages); sin backend ni autenticación.
  host: ${APP_HOST:http://127.0.0.1:8000}
hawk:
  spider:
    base: true
    # Aplicación de una sola página: el contenido se construye con JavaScript.
    ajax: true
    maxDurationMinutes: 5
tags:
  - name: _STACKHAWK_AGENT
    value: ${HAWK_AGENT:none}
  - name: _STACKHAWK_GIT_COMMIT_SHA
    value: ${COMMIT_SHA:none}
  - name: _STACKHAWK_GIT_BRANCH
    value: ${BRANCH_NAME:none}
