# Pruebas → build → deploy a GitHub Pages. Solo se publica dist/ (index.html autocontenido).
name: Pruebas y deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  # Un push hecho con GITHUB_TOKEN no dispara otros workflows: se publica al terminar la sincronización.
  workflow_run:
    workflows: ["Sincronizar DENUE"]
    types: [completed]
    branches: [main]

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pruebas:
    runs-on: ubuntu-24.04  # Playwright 1.56 aún no soporta 26.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: npm ci
      - run: npm run build
      - name: Build reproducible (index.html versionado = build)
        run: git diff --exit-code -- index.html
      - name: Pruebas unitarias del modelo
        run: npm test
      - name: Validación cruzada en Python
        run: python scripts/validar_modelo.py
      - run: npx playwright install --with-deps chromium
      - name: Pruebas e2e
        run: npm run test:e2e
      - uses: actions/upload-pages-artifact@v3
        if: github.ref == 'refs/heads/main'
        with:
          path: dist

  deploy:
    needs: pruebas
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-24.04  # Playwright 1.56 aún no soporta 26.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - id: deployment
        uses: actions/deploy-pages@v4
