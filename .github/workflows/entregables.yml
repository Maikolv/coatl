# Regenera los entregables (PDF, PowerPoint y Excel) cada vez que cambia el sitio, el modelo o el historial de versiones.
# Los PDF se componen con Chromium usando las tipografías, la greca y el logotipo del sitio.
# Los deja como artefacto descargable de la ejecución; no hace commits.
name: Entregables
on:
  push:
    branches: [main]
    paths: ['src/**', 'scripts/**', 'data/**', 'assets/fuentes/**', 'package.json']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  entregables:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - name: Navegador, ffmpeg y fuentes de respaldo para símbolos
        run: |
          npx playwright install --with-deps chromium
          sudo apt-get install -y --no-install-recommends ffmpeg fonts-dejavu-core fonts-liberation
      - name: uv (números de página del índice)
        uses: astral-sh/setup-uv@v5
      - run: npm run entregables
      - uses: actions/upload-artifact@v4
        with:
          name: entregables-coatl
          path: |
            entregables/*.pdf
            entregables/*.pptx
            entregables/*.xlsx
            entregables/diagrama-proceso.*
            assets/plantillas/*.xlsx
          retention-days: 30
